# Spot-first with on-demand fallback, consolidation on — the cost-squeeze
# defaults from the platform plan. Graviton (arm64) preferred: cheaper than
# equivalent x86 instances for the same stateless workloads.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: eks-prod-default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: eks-prod-default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "c", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["3"]
      expireAfter: 720h # recycle nodes monthly to pick up AMI/security patches
  limits:
    cpu: "16"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
